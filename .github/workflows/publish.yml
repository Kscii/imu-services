name: Publish verified release images and deployment bundle
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing reviewed draft release tag
        required: true
        default: v1.1.1
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - name: Verify draft release, source and authorization record
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="$(python -c 'import json; print(json.load(open("release-versions.json"))["service_version"])')"
          test "$TAG" = "v$version"
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true
          mkdir -p .release
          gh release download "$TAG" --pattern "imu-delivery-$version.tar.gz*" --dir .release
          cd .release
          sha256sum -c "imu-delivery-$version.tar.gz.sha256"
          tar -xzf "imu-delivery-$version.tar.gz"
          cd "imu-delivery-$version"
          sha256sum -c SHA256SUMS > checksum-verification.log
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          manifest = json.loads(Path('manifest.json').read_text())
          revision = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert manifest['source_commits']['imu-services'] == revision
          assert manifest['acceptance']['engineering_passed'] is True
          review = json.loads(Path('imu-inference/provenance/source-license-review.json').read_text())
          assert review['public_release_allowed'] is True, 'Model licensing decision is pending'
          PY
          docker load -i "imu-images-$version.tar.gz"
      - name: Verify loaded images against the tagged source and wheel
        env:
          TAG: ${{ inputs.tag }}
        run: python scripts/verify_dual_images.py --tag "${TAG#v}" --output .release/image-verification.json
      - name: Publish exact image contents and record registry digests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          : > .release/registry-images.txt
          for target in runtime query; do
            ref="ghcr.io/${REPOSITORY,,}-$target:$version"
            if docker manifest inspect "$ref" >/dev/null 2>&1; then
              docker pull "$ref"
              test "$(docker inspect --format '{{.Id}}' "$ref")" = "$(docker inspect --format '{{.Id}}' "localhost/imu-$target:$version")"
            else
              docker tag "localhost/imu-$target:$version" "$ref"
              docker push "$ref"
            fi
            docker inspect --format '{{index .RepoDigests 0}}' "$ref" >> .release/registry-images.txt
          done
          for target in runtime query; do
            package="${REPOSITORY##*/}-$target"
            gh api "users/${REPOSITORY%%/*}/packages/container/$package" > ".release/package-$target.json"
          done
          python scripts/package_online.py --registry-images .release/registry-images.txt --output .release
          gh release upload "$TAG" .release/registry-images.txt .release/image-verification.json
          gh release upload "$TAG" .release/package-runtime.json .release/package-query.json
          gh release upload "$TAG" ".release/imu-deploy-$version.tar.gz" ".release/imu-deploy-$version.tar.gz.sha256"
          cat .release/registry-images.txt >> "$GITHUB_STEP_SUMMARY"
          printf '\nRelease remains draft until public visibility and recipient installation checks.\n' >> "$GITHUB_STEP_SUMMARY"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "imu-services"
version = "1.1.1"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12,<3.13"
dependencies = [
  "imu-inference==1.0.1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "httpx>=0.28,<1",
  "prometheus-client>=0.21,<1",
]

[project.optional-dependencies]
worker = ["imu-inference[runtime]==1.0.1", "torch==2.14.1+cpu"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
imu-service = "imu_services.cli:main"

[tool.uv.sources]
imu-inference = { path = "vendor/wheels/imu_inference-1.0.1-py3-none-any.whl" }
torch = { index = "pytorch-cpu" }

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/imu_services"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--disable-plugin-autoload"
markers = ["postgres: requires isolated PostgreSQL", "model: uses real CPU model", "capacity: load tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
